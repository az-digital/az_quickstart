$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Ranking Image
status: experimental
description: A layout- and accessibility-aware image, backed by the media library. Works standalone on a page, or dropped into a Ranking Deck alongside Ranking cards.
props:
  type: object
  properties:
    src:
      type: string
      title: Image
      description: Pick an image from the media library.
      format: uri
      contentMediaType: image/*
      x-allowed-schemes:
        - public
      examples:
        - public://placeholder-1000x500.png
    decorative:
      type: boolean
      title: Decorative
      description: Hide this image from screen readers and other assistive technology, and ignore Alternative Text. Only enable for purely decorative images that carry no information.
      examples:
        - false
    alt:
      type: string
      title: Alternative Text
      description: Describes the image for screen readers and other assistive technology. Ignored when Decorative is enabled.
      examples:
        - Placeholder image, 1000 by 500 pixels
    width_span_desktop:
      type: string
      title: Width Span (Desktop)
      description: How many grid columns this image spans on desktop when placed inside a Ranking Deck (or any other CSS grid layout). Has no effect outside a grid layout. Keep at or below the deck's "Rankings per row on desktop" setting, or the image will overflow into extra columns.
      enum:
        - '1'
        - '2'
        - '3'
        - '4'
      meta:enum:
        '1': 1 column
        '2': 2 columns (default)
        '3': 3 columns
        '4': 4 columns
      examples:
        - '2'
    width_span_tablet:
      type: string
      title: Width Span (Tablet)
      description: How many grid columns this image spans on tablet. Keep at or below the deck's "Rankings per row on tablet" setting, or the image will overflow into extra columns.
      enum:
        - '1'
        - '2'
        - '3'
        - '4'
      meta:enum:
        '1': 1 column
        '2': 2 columns (default)
        '3': 3 columns
        '4': 4 columns
      examples:
        - '2'
    width_span_phone:
      type: string
      title: Width Span (Phone)
      description: How many grid columns this image spans on phone. Keep at or below the deck's "Rankings per row on phone" setting, or the image will overflow into extra columns.
      enum:
        - '1'
        - '2'
        - '3'
        - '4'
      meta:enum:
        '1': 1 column (default)
        '2': 2 columns
        '3': 3 columns
        '4': 4 columns
      examples:
        - '1'
    focal_x:
      type: number
      title: Focal Point X
      description: Horizontal focal point, as a fraction of the image's width from the left (0 = left edge, 1 = right edge). Keeps this point visible when the image is cropped to fill its container. Leave unset for default centered cropping.
      minimum: 0
      maximum: 1
      examples:
        - 0.5
    focal_y:
      type: number
      title: Focal Point Y
      description: Vertical focal point, as a fraction of the image's height from the top (0 = top edge, 1 = bottom edge). Keeps this point visible when the image is cropped to fill its container. Leave unset for default centered cropping.
      minimum: 0
      maximum: 1
      examples:
        - 0.5
    original_width:
      type: integer
      title: Original Width
      description: The image's true width in pixels, before any cropping. Required alongside Focal Point X/Y for accurate focal-point cropping; ignored otherwise.
      minimum: 1
      examples:
        - 1000
    original_height:
      type: integer
      title: Original Height
      description: The image's true height in pixels, before any cropping. Required alongside Focal Point X/Y for accurate focal-point cropping; ignored otherwise.
      minimum: 1
      examples:
        - 500
    utility_classes:
      type: array
      title: Utility Classes
      description: Additional Bootstrap utility classes for the image wrapper, e.g. bottom spacing (mb-4) before the next item on the page. Not needed when the image is placed inside a Ranking Deck.
      items:
        type: string
      examples:
        - - mb-0
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
