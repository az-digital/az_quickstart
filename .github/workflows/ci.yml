name: CI
on:
  pull_request:
  push:
    branches:
      - 'main'
      - '2.x'
      - '3.6.x'
      - '3.5.x'
      - '3.4.x'
      - '2.14.x'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    permissions:
      contents: read
      # Required by the eslint job to annotate pull requests.
      checks: write
      pull-requests: read
