name: Build & deploy review site
on:
  push:
    branches:
      - main

concurrency: kitten-deploy

permissions:
  contents: read

jobs:
  update-code:
    name: Update review site code
    runs-on: ubuntu-latest
    outputs:
      superseded: ${{ steps.superseded.outputs.superseded }}
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'

      - name: Set up SSH
        run: |
          mkdir ${HOME}/.ssh && chmod 700 ${HOME}/.ssh
          echo -e "Host *.drush.in\n    StrictHostKeyChecking no" > ${HOME}/.ssh/config
          echo -e "${{ secrets.PANTHEON_SSH_KEY }}" > ${HOME}/.ssh/id_rsa
          chmod 600 ${HOME}/.ssh/*

      - name: Install Terminus and authenticate Terminus
        uses: pantheon-systems/terminus-github-actions@26fc7c754c80fd1c9fe2d6d3ae77528a15033b6f # v1.2.13
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}

      - name: Sync code to pantheon
        env:
          DEMO_SITE_NAME: ${{ secrets.DEMO_SITE_NAME }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # The concurrency group guarantees no earlier run is still syncing,
          # so any code sync created after this point belongs to this run.
          echo "SYNC_START_TIME=$(date '+%s')" >> "${GITHUB_ENV}"
          terminus -y -n connection:set "${DEMO_SITE_NAME}.dev" git
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "${GITHUB_ACTOR}"
          $(terminus -y -n connection:info --field "Git Command" "${DEMO_SITE_NAME}.dev")
          cd "${DEMO_SITE_NAME}"
          rm composer.lock
          UPSTREAM_VERSION=$(jq -r '.require."az-digital/az_quickstart"' upstream/composer.json)
          COMPOSER_MEMORY_LIMIT=-1 composer -n require "az-digital/az_quickstart:dev-main as ${UPSTREAM_VERSION}"
          git add composer.json composer.lock
          git commit --allow-empty -m "${COMMIT_MESSAGE}"
          git push

      # Runs in the same job as the push so that a failed push fails the run
      # immediately instead of leaving a watcher polling for a sync that will
      # never start while it holds the concurrency group.
      #
      # --max=0 turns off the command's own timeout, which would otherwise
      # give up with a warning and a zero exit code. The step timeout fails
      # the job instead, and a failed sync makes the command exit non-zero.
      - name: Wait for Pantheon code sync
        timeout-minutes: 10
        env:
          DEMO_SITE_NAME: ${{ secrets.DEMO_SITE_NAME }}
        run: |
          terminus -n workflow:wait "${DEMO_SITE_NAME}.dev" --start="${SYNC_START_TIME}" --max=0

      # Every run deploys dev-main, so when a newer commit has landed on the
      # branch the run queued for it will reinstall the site anyway.
      - name: Check for newer commits
        id: superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha' || true)"
          if [ -n "${LATEST_SHA}" ] && [ "${LATEST_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Skipping install: ${GITHUB_REF_NAME} is now at ${LATEST_SHA}."
            echo "superseded=true" >> "${GITHUB_OUTPUT}"
          else
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
          fi

  install-azqs:
    name: Install AZQS
    needs: update-code
    if: needs.update-code.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'

      - name: Set up SSH
        run: |
          mkdir ${HOME}/.ssh && chmod 700 ${HOME}/.ssh
          echo -e "Host *.drush.in\n    StrictHostKeyChecking no" > ${HOME}/.ssh/config
          echo -e "${{ secrets.PANTHEON_SSH_KEY }}" > ${HOME}/.ssh/id_rsa
          chmod 600 ${HOME}/.ssh/*

      - name: Install Terminus and authenticate Terminus
        uses: pantheon-systems/terminus-github-actions@26fc7c754c80fd1c9fe2d6d3ae77528a15033b6f # v1.2.13
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}

      - name: Wake env
        env:
          DEMO_SITE_NAME: ${{ secrets.DEMO_SITE_NAME }}
        run: |
          terminus env:wake "${DEMO_SITE_NAME}.dev"
          sleep 5

      - name: Wipe existing site
        env:
          DEMO_SITE_NAME: ${{ secrets.DEMO_SITE_NAME }}
        run: |
          terminus -y -n env:wipe "${DEMO_SITE_NAME}.dev"

      - name: Install site
        env:
          DEMO_SITE_NAME: ${{ secrets.DEMO_SITE_NAME }}
        run: |
          terminus -y -n connection:set "${DEMO_SITE_NAME}.dev" sftp
          terminus -y -n drush "${DEMO_SITE_NAME}.dev" -- \
          site:install az_quickstart install_configure_form.enable_update_status_module=NULL \
          --account-name="azadmin" \
          --account-mail="noreply@email.arizona.edu" \
          --site-mail="noreply@email.arizona.edu" \
          --site-name="Kitten" \
          --yes \
          --verbose
          terminus -y -n drush "${DEMO_SITE_NAME}.dev" -- pm:install -n -y az_demo
          terminus -y -n connection:set "${DEMO_SITE_NAME}.dev" git

      - name: Clear caches
        env:
          DEMO_SITE_NAME: ${{ secrets.DEMO_SITE_NAME }}
        run: |
          terminus -y -n env:clear-cache "${DEMO_SITE_NAME}.dev"
