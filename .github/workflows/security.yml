name: Security workflow
on:
  schedule:
    - cron:  '0 13 * * *'

permissions:
  contents: read

jobs:
  composer-audit:
    name: composer audit (security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
      - name: Build site
        id: build
        uses: ./.github/actions/build-site
      - name: Audit composer dependencies
        working-directory: ${{ steps.build.outputs.path }}
        run: composer audit

  yarn-npm-audit:
    name: yarn npm audit (security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - run: |
          corepack enable
          yarn npm audit --recursive
