# Recipe for AZ Quickstart local development

# DDEV 1.25.4 increased the nginx FastCGI buffer sizes for Drupal project
# types, which Drupal functional tests need to avoid 502 responses.
ddev_version_constraint: ">=1.25.4"

# This repository is an install profile, not a Drupal site codebase. The site
# codebase is built by `ddev install` in the web container's web_data volume
# (/var/www/html), using az-quickstart-scaffolding, so it isn't on the host.
# Use the drupal11 project type for its Drupal-specific defaults, but disable
# settings management: otherwise DDEV writes web/sites/default/settings*.php
# into this repository on the host, where the site never reads them.
type: drupal11
disable_settings_management: true
docroot: web
php_version: "8.5"
webserver_type: nginx-fpm
corepack_enable: true

# Use the `database` setting rather than the legacy `mariadb_version`, which
# conflicts with the `database` setting `ddev config` writes to config.yaml.
database:
  type: mariadb
  version: "10.11"

web_environment:
  - BROWSERTEST_OUTPUT_DIRECTORY=/tmp
  - BROWSERTEST_OUTPUT_BASE_URL=${DDEV_PRIMARY_URL}
  - SIMPLETEST_BASE_URL=http://web
  - SIMPLETEST_DB=mysql://db:db@db/db
  # Use disable-dev-shm-usage instead of setting shm_usage
  # https://developers.google.com/web/tools/puppeteer/troubleshooting#tips
  # The format of chromeOptions is defined at https://chromedriver.chromium.org/capabilities
  - MINK_DRIVER_ARGS_WEBDRIVER=[\"chrome\", {\"browserName\":\"chrome\",\"goog:chromeOptions\":{\"w3c\":false,\"args\":[\"--disable-gpu\",\"--headless\", \"--no-sandbox\", \"--disable-dev-shm-usage\"]}}, \"http://selenium-chrome:4444/wd/hub\"]
  # DTT
  - DTT_BASE_URL=http://web
  - DTT_MINK_DRIVER_ARGS=[\"chrome\", {\"browserName\":\"chrome\",\"goog:chromeOptions\":{\"w3c\":false,\"args\":[\"--disable-gpu\",\"--headless\", \"--no-sandbox\", \"--disable-dev-shm-usage\"]}}, \"http://selenium-chrome:4444/wd/hub\"]
