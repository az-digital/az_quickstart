# Arizona icons
arizona_icons:
  enabled: true
  label: Arizona Icons
  description: Custom icons designed for the University of Arizona.
  links:
    - https://github.com/az-digital/az-icons
  version: main
  extractor: svg
  config:
    sources:
      - /libraries/az-icons/svg/{icon_id}.svg
  settings:
    size:
      title: "Size"
      type: "integer"
      default: 24
    color:
      title: "Color"
      type: "string"
      enum:
        - inherit
        - red
        - blue
        - cloud
        - caliche
        - tinta
        - azurite
        - arroyo-blue
        - sonoran-red
        - bougainvillea
        - rain
        - saguaro
        - shade
        - brick
        - white
        - black
      # The labels the icon dialog shows. Every enum value needs a label here:
      # Drupal drops a value that has none.
      meta:enum:
        inherit: Inherit
        red: Arizona Red
        blue: Arizona Blue
        cloud: Cloud
        caliche: Caliche
        tinta: Tinta
        azurite: Azurite
        arroyo-blue: Arroyo Blue
        sonoran-red: Sonoran Red
        bougainvillea: Bougainvillea
        rain: Rain
        saguaro: Saguaro
        shade: Shade
        brick: Brick
        white: White
        black: Black
      default: inherit
  library: "az_icons/arizona_icons"
  # Some icons are still saved with an old Arizona Bootstrap color name, such
  # as sky: old revisions and drafts that
  # az_icons_post_update_rename_icon_colors() didn't reach, and content added
  # later. The templates look the old name up in the old-to-new name map and
  # print the new class, such as text-rain.
  template: >-
    {% set new_names = constant('Drupal\\az_core\\Utility\\AZBootstrapColorNames::DEPRECATED_COLOR_NAMES') -%}
    <i class="az-icon-{{ icon_id|clean_class }} {% if color and color != 'inherit' %}text-{{ new_names[color] ?? color }}{% endif %}" style="font-size: {{ size|default(24) }}px; line-height: {{ size|default(24) }}px;" title="{{ icon_id }}"></i>
  preview: >
    {% set new_names = constant('Drupal\\az_core\\Utility\\AZBootstrapColorNames::DEPRECATED_COLOR_NAMES') -%}
    <i class="az-icon-{{ icon_id|clean_class }} {% if color and color != 'inherit' %}text-{{ new_names[color] ?? color }}{% endif %}" style="font-size:35px" title="{{ icon_id }}"></i>

# Material symbols icons
material_symbols:
  enabled: true
  label: Material Symbols Rounded
  description: Material Symbols icons with the rounded style.
  links:
    - https://github.com/google/material-design-icons
  version: 4.0.0
  license:
    name: Apache-2.0
    url: https://github.com/google/material-design-icons/blob/master/LICENSE
    gpl-compatible: true
  extractor: font
  config:
    sources:
      - fonts/MaterialSymbolsRounded.codepoints
  settings:
    size:
      title: "Size"
      type: "integer"
      default: 24
    color:
      title: "Color"
      type: "string"
      enum:
        - inherit
        - red
        - blue
        - cloud
        - caliche
        - tinta
        - azurite
        - arroyo-blue
        - sonoran-red
        - bougainvillea
        - rain
        - saguaro
        - shade
        - brick
        - white
        - black
      # The labels the icon dialog shows. Every enum value needs a label here:
      # Drupal drops a value that has none.
      meta:enum:
        inherit: Inherit
        red: Arizona Red
        blue: Arizona Blue
        cloud: Cloud
        caliche: Caliche
        tinta: Tinta
        azurite: Azurite
        arroyo-blue: Arroyo Blue
        sonoran-red: Sonoran Red
        bougainvillea: Bougainvillea
        rain: Rain
        saguaro: Saguaro
        shade: Shade
        brick: Brick
        white: White
        black: Black
      default: inherit
  library: "az_icons/material_symbols"
  # See the note on the arizona_icons templates.
  template: >-
    {% set new_names = constant('Drupal\\az_core\\Utility\\AZBootstrapColorNames::DEPRECATED_COLOR_NAMES') -%}
    <span class="material-symbols-rounded {% if color and color != 'inherit' %}text-{{ new_names[color] ?? color }}{% endif %}" style="font-size:{{ size|default(24) }}px;">{{ icon_id }}</span>
  preview: >
    {% set new_names = constant('Drupal\\az_core\\Utility\\AZBootstrapColorNames::DEPRECATED_COLOR_NAMES') -%}
    <span class="material-symbols-rounded {% if color and color != 'inherit' %}text-{{ new_names[color] ?? color }}{% endif %}" style="font-size:35px;">{{ icon_id }}</span>
