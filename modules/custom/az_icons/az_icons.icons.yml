# Arizona icons
arizona_icons:
  enabled: true
  label: Arizona Icons
  description: Custom icons designed for the University of Arizona.
  links:
    - https://github.com/az-digital/az-icons
  version: main
  extractor: svg
  config:
    sources:
      - /libraries/az-icons/svg/{icon_id}.svg
  settings:
    size:
      title: "Size"
      type: "integer"
      default: 24
    color:
      title: "Color"
      type: "string"
      enum:
        - inherit
        - red
        - blue
        - cool-gray
        - warm-gray
        - midnight
        - azurite
        - oasis
        - chili
        - bloom
        - sky
        - leaf
        - river
        - mesa
        - white
        - black
      # The labels the icon dialog shows. Each value keeps its old name,
      # because that name is saved in content (data-icon-settings on
      # <drupal-icon>). Every enum value needs a label here: Drupal drops a
      # value that has none.
      meta:enum:
        inherit: Inherit
        red: Arizona Red
        blue: Arizona Blue
        cool-gray: Cloud
        warm-gray: Caliche
        midnight: Tinta
        azurite: Azurite
        oasis: Arroyo Blue
        chili: Sonoran Red
        bloom: Bougainvillea
        sky: Rain
        leaf: Saguaro
        river: Shade
        mesa: Brick
        white: White
        black: Black
      default: inherit
  library: "az_icons/arizona_icons"
  # The saved color can be an old Arizona Bootstrap name, such as sky. The
  # templates look it up in the old-to-new name map and print the new class,
  # such as text-rain.
  template: >-
    {% set new_names = constant('Drupal\\az_core\\Utility\\AZBootstrapColorNames::DEPRECATED_COLOR_NAMES') -%}
    <i class="az-icon-{{ icon_id|clean_class }} {% if color != 'inherit' %}text-{{ new_names[color] ?? color }}{% endif %}" style="font-size: {{ size|default(24) }}px; line-height: {{ size|default(24) }}px;" title="{{ icon_id }}"></i>
  preview: >
    {% set new_names = constant('Drupal\\az_core\\Utility\\AZBootstrapColorNames::DEPRECATED_COLOR_NAMES') -%}
    <i class="az-icon-{{ icon_id|clean_class }} {% if color != 'inherit' %}text-{{ new_names[color] ?? color }}{% endif %}" style="font-size:35px" title="{{ icon_id }}"></i>

# Material symbols icons
material_symbols:
  enabled: true
  label: Material Symbols Rounded
  description: Material Symbols icons with the rounded style.
  links:
    - https://github.com/google/material-design-icons
  version: 4.0.0
  license:
    name: Apache-2.0
    url: https://github.com/google/material-design-icons/blob/master/LICENSE
    gpl-compatible: true
  extractor: font
  config:
    sources:
      - fonts/MaterialSymbolsRounded.codepoints
  settings:
    size:
      title: "Size"
      type: "integer"
      default: 24
    color:
      title: "Color"
      type: "string"
      enum:
        - inherit
        - red
        - blue
        - cool-gray
        - warm-gray
        - midnight
        - azurite
        - oasis
        - chili
        - bloom
        - sky
        - leaf
        - river
        - mesa
        - white
        - black
      # The labels the icon dialog shows. Each value keeps its old name,
      # because that name is saved in content (data-icon-settings on
      # <drupal-icon>). Every enum value needs a label here: Drupal drops a
      # value that has none.
      meta:enum:
        inherit: Inherit
        red: Arizona Red
        blue: Arizona Blue
        cool-gray: Cloud
        warm-gray: Caliche
        midnight: Tinta
        azurite: Azurite
        oasis: Arroyo Blue
        chili: Sonoran Red
        bloom: Bougainvillea
        sky: Rain
        leaf: Saguaro
        river: Shade
        mesa: Brick
        white: White
        black: Black
      default: inherit
  library: "az_icons/material_symbols"
  # See the note on the arizona_icons templates.
  template: >-
    {% set new_names = constant('Drupal\\az_core\\Utility\\AZBootstrapColorNames::DEPRECATED_COLOR_NAMES') -%}
    <span class="material-symbols-rounded {% if color != 'inherit' %}text-{{ new_names[color] ?? color }}{% endif %}" style="font-size:{{ size|default(24) }}px;">{{ icon_id }}</span>
  preview: >
    {% set new_names = constant('Drupal\\az_core\\Utility\\AZBootstrapColorNames::DEPRECATED_COLOR_NAMES') -%}
    <span class="material-symbols-rounded {% if color != 'inherit' %}text-{{ new_names[color] ?? color }}{% endif %}" style="font-size:35px;">{{ icon_id }}</span>
